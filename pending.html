<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pago en proceso – LuniBakery</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--pink:#f4a7b9;--pink-dark:#e8809a;--pink-light:#fce4ec;--cream:#fdf8f3;--dark:#1a1015;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:#fff;border-radius:28px;padding:52px 40px;max-width:480px;width:100%;text-align:center;box-shadow:0 8px 48px rgba(180,80,110,0.12);}
  .icon{font-size:72px;margin-bottom:24px;}
  h1{font-family:'Playfair Display',serif;font-size:1.8rem;margin-bottom:12px;}
  p{font-size:15px;line-height:1.7;color:#7a5a68;margin-bottom:8px;}
  .detail-box{background:#fff3e0;border:1.5px solid #ffb74d;border-radius:16px;padding:20px;margin:24px 0;text-align:left;font-size:14px;color:#e65100;}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--pink);color:var(--dark);font-weight:700;font-size:15px;padding:14px 32px;border-radius:50px;text-decoration:none;margin-top:16px;transition:all .2s;}
  .logo{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--pink-dark);margin-bottom:32px;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">LuniBakery</div>
  <div class="icon">⏳</div>
  <h1>Pago en revisión</h1>
  <p>Tu pago está siendo procesado. Esto puede tomar algunas horas dependiendo del medio de pago utilizado.</p>
  <div class="detail-box">⚠️ No hagas otro pedido. Te avisaremos por email y WhatsApp cuando el pago sea confirmado.</div>
  <a class="btn" href="https://wa.me/56952393294?text=Hola%20LuniBakery!%20Mi%20pago%20qued%C3%B3%20pendiente%2C%20quisiera%20confirmar%20el%20estado" target="_blank" style="background:#25D366;color:#fff;">💬 Consultar estado por WhatsApp</a>
</div>
</body>
</html>
