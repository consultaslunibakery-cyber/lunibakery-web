<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin – LuniBakery</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--pink:#f4a7b9;--pink-dark:#e8809a;--pink-light:#fce4ec;--cream:#fdf8f3;--dark:#1a1015;--text:#3d2535;--border:#f0dce5;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;}

  /* LOGIN */
  .login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .login-card{background:#fff;border-radius:24px;padding:40px;max-width:380px;width:100%;box-shadow:0 8px 40px rgba(180,80,110,0.12);text-align:center;}
  .login-logo{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--pink-dark);margin-bottom:8px;}
  .login-sub{font-size:13px;color:var(--text);opacity:.6;margin-bottom:28px;}
  .login-input{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:12px 16px;font-size:15px;font-family:'DM Sans',sans-serif;outline:none;margin-bottom:12px;transition:border-color .2s;}
  .login-input:focus{border-color:var(--pink);}
  .login-btn{width:100%;background:var(--pink);border:none;border-radius:50px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .2s;}
  .login-btn:hover{background:var(--pink-dark);}
  .login-err{color:#e53935;font-size:13px;margin-top:8px;display:none;}

  /* ADMIN PANEL */
  .admin-panel{display:none;padding:24px;max-width:1100px;margin:0 auto;}
  .admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
  .admin-header h1{font-family:'Playfair Display',serif;font-size:1.6rem;}
  .admin-header span{font-size:13px;color:var(--text);opacity:.6;}
  .logout-btn{background:var(--border);border:none;border-radius:50px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}

  /* STATS */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:28px;}
  .stat-card{background:#fff;border-radius:16px;padding:16px 20px;box-shadow:0 2px 12px rgba(180,80,110,0.08);}
  .stat-label{font-size:11px;font-weight:600;color:var(--text);opacity:.5;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
  .stat-value{font-size:24px;font-weight:700;color:var(--pink-dark);}

  /* FILTROS */
  .filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .filter-btn{padding:7px 16px;border-radius:50px;border:2px solid var(--border);background:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;}
  .filter-btn.active{background:var(--pink);border-color:var(--pink);font-weight:600;}

  /* PEDIDOS */
  .orders-list{display:flex;flex-direction:column;gap:14px;}
  .order-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(180,80,110,0.08);border-left:4px solid var(--border);}
  .order-card.pendiente{border-left-color:#ffb74d;}
  .order-card.confirmado{border-left-color:#66bb6a;}
  .order-card.entregado{border-left-color:#42a5f5;}
  .order-card.esperando{border-left-color:#ab47bc;}
  .order-card.cancelado{border-left-color:#ef5350;}
  .order-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
  .order-id{font-size:12px;font-weight:700;color:var(--text);opacity:.4;}
  .order-date{font-size:12px;color:var(--text);opacity:.5;}
  .order-estado{font-size:11px;font-weight:700;padding:4px 12px;border-radius:50px;text-transform:uppercase;letter-spacing:.5px;}
  .estado-pendiente{background:#fff3e0;color:#e65100;}
  .estado-confirmado{background:#e8f5e9;color:#2e7d32;}
  .estado-entregado{background:#e3f2fd;color:#1565c0;}
  .estado-esperando{background:#f3e5f5;color:#6a1b9a;}
  .estado-cancelado{background:#ffebee;color:#c62828;}
  .order-cliente{font-size:15px;font-weight:700;margin-bottom:4px;}
  .order-contacto{font-size:13px;color:var(--text);opacity:.6;margin-bottom:10px;}
  .order-productos{background:var(--cream);border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.6;margin-bottom:10px;}
  .order-nota{background:#fff3e0;border-radius:10px;padding:8px 12px;font-size:12px;color:#e65100;margin-bottom:10px;}
  .order-footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  .order-total{font-size:16px;font-weight:700;color:var(--pink-dark);}
  .order-pago{font-size:12px;background:var(--pink-light);color:var(--pink-dark);padding:3px 10px;border-radius:50px;font-weight:600;}
  .order-fecha-entrega{font-size:12px;font-weight:600;color:var(--text);}
  .estado-select{border:1.5px solid var(--border);border-radius:10px;padding:6px 10px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;outline:none;}

  .empty{text-align:center;padding:60px 20px;color:var(--text);opacity:.4;}
  .empty div{font-size:48px;margin-bottom:12px;}
  .loading{text-align:center;padding:40px;color:var(--text);opacity:.5;}
  .refresh-btn{background:var(--pink-light);border:none;border-radius:50px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--pink-dark);}

  @media(max-width:500px){
    .admin-panel{padding:16px;}
    .order-footer{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">🎂 LuniBakery</div>
    <p class="login-sub">Panel de Administración</p>
    <input class="login-input" id="secretInput" type="password" placeholder="Contraseña secreta" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Ingresar</button>
    <p class="login-err" id="loginErr">Contraseña incorrecta</p>
  </div>
</div>

<!-- PANEL -->
<div class="admin-panel" id="adminPanel">
  <div class="admin-header">
    <div>
      <h1>Panel de Pedidos</h1>
      <span id="lastUpdate"></span>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="refresh-btn" onclick="loadOrders()">🔄 Actualizar</button>
      <button class="logout-btn" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat-card"><div class="stat-label">Total Pedidos</div><div class="stat-value" id="statTotal">0</div></div>
    <div class="stat-card"><div class="stat-label">Pendientes</div><div class="stat-value" id="statPendientes" style="color:#e65100">0</div></div>
    <div class="stat-card"><div class="stat-label">Confirmados</div><div class="stat-value" id="statConfirmados" style="color:#2e7d32">0</div></div>
    <div class="stat-card"><div class="stat-label">Ingresos del Mes</div><div class="stat-value" id="statIngresos">$0</div></div>
  </div>

  <!-- FILTROS -->
  <div class="filters">
    <button class="filter-btn active" onclick="filterOrders('todos', this)">Todos</button>
    <button class="filter-btn" onclick="filterOrders('Pendiente', this)">Pendientes</button>
    <button class="filter-btn" onclick="filterOrders('Esperando comprobante', this)">Esperando comprobante</button>
    <button class="filter-btn" onclick="filterOrders('Confirmado', this)">Confirmados</button>
    <button class="filter-btn" onclick="filterOrders('Entregado', this)">Entregados</button>
    <button class="filter-btn" onclick="filterOrders('Cancelado', this)">Cancelados</button>
  </div>

  <div class="orders-list" id="ordersList">
    <div class="loading">Cargando pedidos...</div>
  </div>
</div>

<script>
let secret = '';
let allOrders = [];
let currentFilter = 'todos';

function doLogin() {
  const val = document.getElementById('secretInput').value.trim();
  if (!val) return;
  secret = val;
  document.getElementById('loginErr').style.display = 'none';
  loadOrders();
}

function logout() {
  secret = '';
  allOrders = [];
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('secretInput').value = '';
}

async function loadOrders() {
  try {
    const res = await fetch(`/api/get-orders?secret=${encodeURIComponent(secret)}`);
    if (res.status === 401) {
      document.getElementById('loginErr').style.display = 'block';
      return;
    }
    const data = await res.json();
    allOrders = data;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    document.getElementById('lastUpdate').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-CL');
    updateStats();
    renderOrders();
  } catch (err) {
    console.error(err);
    alert('Error conectando con el servidor');
  }
}

function updateStats() {
  const now = new Date();
  const thisMonth = allOrders.filter(o => {
    const d = new Date(o.fecha_pedido);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
  const pendientes = allOrders.filter(o => o.estado === 'Pendiente' || o.estado === 'Esperando comprobante');
  const confirmados = allOrders.filter(o => o.estado === 'Confirmado');
  const ingresos = thisMonth.filter(o => o.estado !== 'Cancelado').reduce((a, o) => a + (o.total || 0), 0);

  document.getElementById('statTotal').textContent = allOrders.length;
  document.getElementById('statPendientes').textContent = pendientes.length;
  document.getElementById('statConfirmados').textContent = confirmados.length;
  document.getElementById('statIngresos').textContent = '$' + ingresos.toLocaleString('es-CL');
}

function filterOrders(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
}

function renderOrders() {
  const list = document.getElementById('ordersList');
  const filtered = currentFilter === 'todos' ? allOrders : allOrders.filter(o => o.estado === currentFilter);

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty"><div>📭</div><p>No hay pedidos en esta categoría</p></div>';
    return;
  }

  list.innerHTML = filtered.map(order => {
    const fecha = new Date(order.fecha_pedido).toLocaleDateString('es-CL', {day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
    const estadoClass = order.estado.toLowerCase().replace(/ /g,'-').replace('esperando-comprobante','esperando');
    const estadoBadgeClass = 'estado-' + (order.estado === 'Esperando comprobante' ? 'esperando' : order.estado.toLowerCase());

    // Extraer fecha de entrega de la nota
    const notaMatch = order.nota?.match(/Fecha: (.+?)(\s*\||$)/);
    const fechaEntrega = notaMatch ? notaMatch[1] : '';
    const direccion = order.nota?.includes('Despacho:') ? order.nota.split('Despacho:')[1]?.split('|')[0]?.trim() : 'Retiro en tienda';

    return `
    <div class="order-card ${estadoClass}" id="card-${order.id}">
      <div class="order-top">
        <div>
          <div class="order-id">${order.id}</div>
          <div class="order-date">📅 Pedido: ${fecha}</div>
        </div>
        <span class="order-estado ${estadoBadgeClass}">${order.estado}</span>
      </div>
      <div class="order-cliente">👤 ${order.cliente?.nombre || 'Sin nombre'}</div>
      <div class="order-contacto">
        📧 ${order.cliente?.email || '-'} &nbsp;|&nbsp; 📞 ${order.cliente?.telefono || '-'}
      </div>
      <div class="order-productos">🛒 ${order.productos || '-'}</div>
      ${fechaEntrega ? `<div style="font-size:13px;font-weight:600;margin-bottom:8px;">📦 Entrega: ${fechaEntrega} — ${direccion}</div>` : ''}
      ${order.nota && !order.nota.startsWith('Retiro') && !order.nota.startsWith('Despacho') ? `<div class="order-nota">📝 ${order.nota}</div>` : ''}
      <div class="order-footer">
        <div>
          <div class="order-total">$${(order.total||0).toLocaleString('es-CL')}</div>
          ${order.despacho > 0 ? `<div style="font-size:11px;color:var(--text);opacity:.5">+ $${order.despacho.toLocaleString('es-CL')} despacho</div>` : ''}
        </div>
        <span class="order-pago">${order.metodo_pago}</span>
        <select class="estado-select" onchange="updateEstado('${order.id}', this.value)">
          <option ${order.estado==='Pendiente'?'selected':''}>Pendiente</option>
          <option ${order.estado==='Esperando comprobante'?'selected':''}>Esperando comprobante</option>
          <option ${order.estado==='Confirmado'?'selected':''}>Confirmado</option>
          <option ${order.estado==='Entregado'?'selected':''}>Entregado</option>
          <option ${order.estado==='Cancelado'?'selected':''}>Cancelado</option>
        </select>
      </div>
    </div>`;
  }).join('');
}

async function updateEstado(id, estado) {
  try {
    await fetch(`/api/get-orders?secret=${encodeURIComponent(secret)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, estado }),
    });
    const order = allOrders.find(o => o.id === id);
    if (order) { order.estado = estado; updateStats(); renderOrders(); }
  } catch (err) { alert('Error actualizando estado'); }
}
</script>
</body>
</html>
